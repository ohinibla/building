<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="./index.css" rel="stylesheet" />
    <script src="./index.js" defer></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>ریز هزینه های ساختمان</title>
  </head>
  <body>
    <div id="outer">
      <div class="notice-wrapper">
        <div
          class="flashing-notice"
          id="notice"
          role="alert"
          aria-live="polite"
        ></div>
      </div>

      <header class="section-header">
        <span class="icon" aria-hidden="true">📋</span>
        <h1 id="pageTitle">ریز هزینه های ساختمان</h1>
      </header>

      <div class="table-wrap">
        <table>
          <caption class="sr-only">
            ریز هزینه‌های ساختمان به تفکیک ماه
          </caption>
          <thead>
            <tr>
              <th class="month-head" scope="col">ماه</th>
              <th scope="col">تاریخ</th>
              <th scope="col">مورد / واحد</th>
              <th scope="col">مجموع</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="4" class="status-msg">در حال بارگذاری…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <dialog class="modal" id="expenseDialog" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" id="modalClose" aria-label="بستن">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-amount" id="modalAmount"></div>
        <div class="modal-desc" id="modalDesc"></div>
        <div id="gallerySection" style="display: none">
          <p class="gallery-title">تصاویر فاکتور</p>
          <div class="gallery" id="modalGallery"></div>
        </div>
      </div>
    </dialog>
  </body>
</html>
